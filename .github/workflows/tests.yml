name: Chatbot tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test learning, reasoning, persistence and HTTP contracts
        run: python -m unittest discover -s tests/chat -v

      - name: Test F00 research protocol, generated worlds and evaluation isolation
        run: python -m unittest discover -s tests/research -v

      - name: Test own cognition, memory, learning gates and isolated programs
        run: python -m unittest discover -s tests/cognition -v

      - name: Test physical, quantum and discovery services
        run: python -m unittest discover -s tests/science -v
